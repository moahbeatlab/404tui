<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404tui replay</title>
<style>
  :root { --bg:#121214; --panel:#1b1b1e; --amber:#ffb000; --text:#ddd; --dim:#888; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px ui-monospace, Menlo, Consolas, monospace; }
  body { display:flex; flex-direction:column; }
  #stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  canvas { width:100%; height:100%; object-fit:contain; background:#121214; }
  #bar { display:flex; flex-direction:column; gap:8px; padding:8px 16px 10px; background:#161616; border-top:1px solid #2a2a2a; }
  #bar input { background:#2b2b2b; color:var(--text); border:0; padding:6px 10px; font:inherit; }
  #bar button, #bar select { background:#2b2b2b; color:var(--text); border:0; padding:6px 12px; font:inherit; cursor:pointer; }
  #bar button:hover { background:#3a3a3a; }
  #tl { display:grid; grid-template-columns:72px minmax(0, 1fr); align-items:center; row-gap:4px; column-gap:10px; }
  #tl .lbl { color:var(--dim); font-size:11px; text-align:right; }
  #cues, #capslane { position:relative; height:26px; margin:0 8px; background:#1d1d20; border-radius:4px; }
  #capslane { height:22px; }
  #seek { width:100%; min-width:0; box-sizing:border-box; margin:0; accent-color:var(--amber); }
  html, body { overflow-x:hidden; }
  #cues .seg { position:absolute; top:0; bottom:0; box-sizing:border-box; border-left:2px solid var(--amber); background:rgba(255,176,0,.2); color:var(--text); font-size:12px; padding:4px 6px 0 11px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; cursor:pointer; touch-action:none; }
  #cues .seg.auto { border-left-color:#8a6a2a; background:rgba(255,176,0,.08); color:#c9b27a; }
  #cues .seg .h { position:absolute; left:-4px; top:0; bottom:0; width:12px; cursor:ew-resize; }
  #capslane .cap { position:absolute; top:2px; bottom:2px; box-sizing:border-box; background:rgba(95,175,255,.22); border-left:2px solid #5fafff; border-radius:3px; font-size:11px; padding:2px 6px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; cursor:grab; touch-action:none; }
  #capslane .cap .hd { position:absolute; top:0; bottom:0; width:9px; cursor:ew-resize; }
  #capslane .cap .hd.l { left:-3px; } #capslane .cap .hd.r { right:-1px; }
  #ctl { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; }
  #ctl .grp { display:flex; gap:8px; align-items:center; }
  #ctl .grp.right { margin-left:auto; }
  #cuepop { position:fixed; bottom:calc(var(--barh, 110px) + 8px); display:none; gap:6px; align-items:center; background:#1b1b1e; border:1px solid #34343a; padding:8px 10px; z-index:6; }
  #cuepop.open { display:flex; }
  #cuepop input, #cuepop select, #cuepop button { background:#2b2b2b; color:var(--text); border:0; padding:5px 8px; font:inherit; }
  #time { min-width:150px; text-align:right; color:var(--dim); }
  #nudge { color:var(--dim); min-width:110px; }
  body.nohud #bar, body.nohud #stylebox { display:none !important; }
  #capbox { position:fixed; right:16px; bottom:calc(var(--barh, 110px) + 8px); background:#1b1b1e; border:1px solid #34343a; padding:12px 14px; display:none; flex-direction:column; gap:8px; z-index:5; width:min(520px, 92vw); max-height:70vh; overflow:auto; }
  #capbox.open { display:flex; }
  #capbox label.g { display:flex; gap:8px; align-items:center; color:var(--dim); }
  #capbox .h { color:#666; font-size:11px; }
  #capbox .row { display:flex; gap:6px; align-items:center; }
  #capbox input, #capbox button { background:#2b2b2b; color:var(--text); border:0; padding:5px 8px; font:inherit; }
  #capbox input.t { width:64px; } #capbox input.x { flex:1; min-width:0; }
  body.nohud #capbox { display:none !important; }
  #stylebox { position:fixed; right:16px; bottom:calc(var(--barh, 110px) + 8px); background:#1b1b1e; border:1px solid #34343a; padding:12px 14px; display:none; flex-direction:column; gap:8px; z-index:5; max-width:min(440px, 92vw); }
  #stylebox.open { display:flex; }
  #stylebox .bw { display:flex; gap:6px; align-items:center; }
  #stylebox label { white-space:nowrap; display:flex; gap:8px; align-items:center; justify-content:space-between; color:var(--dim); }
  #stylebox input[type=color] { width:44px; height:26px; padding:0; border:0; background:none; }
  #stylebox input, #stylebox select, #stylebox button { background:#2b2b2b; color:var(--text); border:0; padding:5px 8px; font:inherit; }
  #msg { position:fixed; left:50%; top:45%; transform:translateX(-50%); background:#2b2b2b; padding:16px 24px; display:none; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="bar">
  <div id="tl">
    <span class="lbl">patterns</span><div id="cues" title="the patterns: click one to edit it, drag its left edge to move it"></div>
    <span class="lbl">captions</span><div id="capslane" title="the captions: click one to edit it"></div>
    <span class="lbl"></span><input id="seek" type="range" min="0" max="1000" value="0">
  </div>
  <div id="ctl">
    <span class="grp"><button id="play" title="Space">play</button><span id="time">0:00.0</span></span>
    <span class="grp"><input id="title" placeholder="title" size="18" title="the title shown in the video">
      <select id="pat" title="the pattern that plays from here on (at the next loop start): the unit did not say"><option value="">pattern from here...</option></select><button id="clearcues" title="remove all the patterns set by hand">clear</button></span>
    <span class="grp"><select id="speed" title="speed"><option>0.25</option><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option></select>
      <span id="nudge" title="[ and ] move the events against the sound by 10 ms">sync +0 ms</span></span>
    <span class="grp right"><button id="capbtn" title="text shown at times of the take">captions</button>
      <button id="stylebtn" title="colours, background, logo, handle">style</button>
      <button id="full" title="f">full screen</button></span>
  </div>
  <div id="cuepop"></div>
</div>
<div id="capbox">
  <div id="caplist"></div>
  <label class="g">fade in and out <input id="c_fade" type="number" min="0" max="3" step="0.05" style="width:64px"> s <span class="h">for all captions</span></label>
  <label class="g">blur behind a caption <input id="c_blur" type="range" min="0" max="12" step="0.5" style="width:130px"> <span id="c_blurv" class="h"></span></label>
  <label class="g">dim behind a caption <input id="c_dim" type="range" min="0" max="80" step="1" style="width:130px"> <span id="c_dimv" class="h"></span></label>
  <label class="g">a new caption lasts <input id="c_len" type="number" min="1" max="60" step="0.5" style="width:64px"> s <span class="h">for all new captions</span></label>
  <button id="capadd" title="a caption from the time you are at">add a caption here</button>
</div>
<div id="stylebox">
  <label>look <select id="s_preset"></select></label>
  <label>accent <input id="s_accent" type="color" value="#ffb000"> <button id="s_accent_auto" title="the colour of the look">auto</button></label>
  <label>background <select id="s_bgkind"><option value="preset">the look's</option><option value="solid">colour</option><option value="gradient">gradient</option><option value="image">picture</option></select></label>
  <label>colours <input id="s_bg1" type="color" value="#000000"> <input id="s_bg2" type="color" value="#1b1b2e"></label>
  <label>picture <input id="s_bgimg" type="file" accept="image/*"></label>
  <label>picture dimmed <input id="s_bgdim" type="range" min="0" max="95" value="60"></label>
  <label>logo <input id="s_logo" type="file" accept="image/*"> <button id="s_logo_clear">remove</button></label>
  <label>BUS 1 is <span class="bw"><select id="s_bussel0"></select> <input id="s_bus0" placeholder="your own text" size="18" hidden></span></label>
  <label>BUS 2 is <span class="bw"><select id="s_bussel1"></select> <input id="s_bus1" placeholder="your own text" size="18" hidden></span></label>
  <label>BUS 3 is <span class="bw"><select id="s_bussel2"></select> <input id="s_bus2" placeholder="your own text" size="18" hidden></span></label>
  <label>BUS 4 is <span class="bw"><select id="s_bussel3"></select> <input id="s_bus3" placeholder="your own text" size="18" hidden></span></label>
  <label>handle <input id="s_handle" placeholder="@yourname" size="18"></label>
  <label>subtitle <input id="s_sub" placeholder="under the title" size="22"></label>
  <button id="s_reset">reset the look</button>
</div>
<div id="msg"></div>
<audio id="audio" preload="auto" src="/audio"></audio>
<script src="/fxdata.js"></script>
<script>
"use strict";
// ---- the page of a replay: everything on the screen is a function of the time, so that it can be watched (the audio drives the time)
// and rendered frame by frame (a program sets the time: window.replay.setTime(t)).
// the colours of 404jam (src/styles/main.css), so that the replay looks like the rest of the family
const COL = { bg:"#121214", deep:"#161616", panel:"#1b1b1e", tile:"#2c2c30", tile2:"#1d1d20", amber:"#ffb000", amberD:"#7a5a00", amberDD:"#5a4000", text:"#ececf0", dim:"#9a9aa4", line:"#34343a",
              good:"#87d787", bad:"#ff5f5f", blue:"#5fafff", red:"#ff3b30", green:"#3ddc84", gold:"#ffb300", purple:"#c792ea" };
const BUSCOL = { 1: COL.blue, 2: COL.red, 3: COL.green, 4: COL.gold };
const FONT = (px, bold) => (bold ? "bold " : "") + px + "px ui-monospace, Menlo, Consolas, monospace";
const cv = document.getElementById("c"), g = cv.getContext("2d");
const params = new URLSearchParams(location.search);
// ?format=vertical (shorts, reels: 1080x1920) lays the same panels one under the other
const VERT = ["vertical", "shorts", "reels", "9x16"].includes(params.get("format") || "");
if (VERT) { cv.width = 1080; cv.height = 1920; }
const W = cv.width, H = cv.height;
// where every panel is: [x, y, w, h]. The bottom of a vertical frame is left free for what the platforms put over it.
const L = VERT
  ? { pads: [20, 108, 1040, 540], pattern: [20, 660, 1040, 350], fx: [20, 1022, 1040, 220], meter: [20, 1254, 1040, 270], feed: [20, 1536, 1040, 168] }
  : { pads: [40, 80, 880, 560], pattern: [40, 656, 880, 394], fx: [960, 80, 920, 236], meter: [960, 332, 920, 452], feed: [960, 800, 920, 250] };
if (params.get("hud") === "0") document.body.classList.add("nohud");

let TITLE = "", EV = [], AN = null, PROJ = { pads: [], patterns: [] }, FILE = "", OFFSET = 0, NUDGE = 0;
const padInfo = new Map(), patBySlot = new Map(), patByLabel = new Map();
const otherNotes = [], padEv = new Map(), ccEv = new Map(), fxNum = new Map(), fxOn = new Map(), beats = [], transport = [], patEv = [];
let peak = null, spec = null, lastHit = [];
const loopStarts = []; // the unit marks every loop of the pattern with a note (channel 13, note 48)
let cues = [];         // the patterns set by hand: { t (time of the log), label }, kept by the server beside the event log
// ---- the patterns on the timeline: the ones the log says (dim tags) and the ones set by hand (amber tags). A tag can be dragged or edited
// (its pattern, its time, deleted); the first change takes the log's patterns over as cues ("adopted"), so that the list is one and whole.
// Everything that follows from the pattern (the bank of the pads, the pattern panel, the tempo, the countdown, the flashes) follows the tags.
let logPat = null, adopted = false;
const parseTime = v => { const m = String(v).match(/^(\d+):(\d+(?:\.\d+)?)$/); return m ? +m[1] * 60 + +m[2] : parseFloat(v) || 0; };
function cueFor(label, t) {
  const p = patByLabel.get(label);
  return { t: +t.toFixed(3), label,
    pattern: p ? { slot: p.slot, label: p.label, bars: p.bars, length: p.length, notes: p.notes } : undefined,
    pads: p ? [...p.pads].map(n => padInfo.get(n)).filter(Boolean) : undefined };
}
function patEvents() {
  patEv.length = 0;
  patEv.push(...(adopted ? [] : logPat), ...cues.map(c => ({ t: c.t, now: c.label, next: "", cue: true })));
  patEv.sort((a, b) => a.t - b.t);
}
function adoptNow() {
  if (adopted) return;
  for (const e of logPat) if (!cues.some(c => Math.abs(c.t - e.t) < 0.05)) cues.push(cueFor(e.now, e.t));
  cues.sort((a, b) => a.t - b.t); adopted = true;
}
function rebuildCues() {
  if (!logPat) logPat = patEv.slice();
  patEvents();
  const box = document.getElementById("cues"); if (!box) return;
  box.textContent = "";
  const d = AN ? AN.duration : 0; if (!d) return;
  const items = [...(adopted ? [] : logPat.map(e => ({ auto: true, t: e.t, label: e.now, e }))), ...cues.map(c => ({ t: c.t, label: c.label, c }))].sort((a, b) => a.t - b.t);
  items.forEach((it, i) => { // a block from the change to the next one, named by its pattern; its left edge moves it
    const end = i + 1 < items.length ? items[i + 1].t : d + OFFSET, x0 = clamp((it.t - OFFSET) / d, 0, 1), x1 = clamp((end - OFFSET) / d, 0, 1);
    const sp = document.createElement("div"); sp.className = "seg" + (it.auto ? " auto" : ""); sp.textContent = it.label;
    sp.title = it.label + " from " + mmss(it.t - OFFSET) + ": click to edit, drag the left edge to move";
    sp.style.left = x0 * 100 + "%"; sp.style.width = Math.max(x1 - x0, 0.002) * 100 + "%";
    const h = document.createElement("span"); h.className = "h"; h.onpointerdown = ev => startDrag(ev, sp, it); sp.appendChild(h);
    sp.onclick = ev => { if (ev.target === h) return; openCuePop(it, sp); };
    box.appendChild(sp);
  });
}
function saveCues() { fetch("/cues", { method: "POST", body: JSON.stringify({ cues, adopted }) }).catch(() => {}); }
function cueOf(it) { if (it.c) return it.c; adoptNow(); return cues.find(c => Math.abs(c.t - it.t) < 0.05 && c.label === it.label) || cues.find(c => Math.abs(c.t - it.t) < 0.05); }
function startDrag(ev, sp, it) {
  ev.preventDefault(); try { sp.setPointerCapture(ev.pointerId); } catch (e) { /* a pointer that is gone */ }
  const box = document.getElementById("cues"), x0 = ev.clientX; let moved = false, cue = null;
  sp.onpointermove = e2 => {
    if (!moved && Math.abs(e2.clientX - x0) < 4) return;
    if (!moved) { moved = true; cue = cueOf(it); if (!cue) return; }
    const r = box.getBoundingClientRect(), frac = clamp((e2.clientX - r.left) / r.width, 0, 1), d = AN ? AN.duration : 0;
    cue.t = +snapLoop(frac * d + OFFSET).toFixed(3);
    sp.style.left = clamp((cue.t - OFFSET) / d * 100, 0, 100) + "%";
    patEvents();
  };
  sp.onpointerup = () => {
    sp.onpointermove = sp.onpointerup = null;
    if (moved) { cues.sort((a, b) => a.t - b.t); rebuildCues(); saveCues(); }
  };
}
// the small editor of a tag: the pattern, the time, a step to the loop before or after, delete
function openCuePop(it, sp) {
  const cue = cueOf(it); if (!cue) return;
  rebuildCues();
  const pop = document.getElementById("cuepop"); pop.textContent = ""; pop.classList.add("open");
  const sel = document.createElement("select"), time = document.createElement("input");
  const labels = new Set([...patByLabel.keys(), cue.label]);
  for (const l of [...labels].sort((a, b) => (patByLabel.get(a) ? patByLabel.get(a).slot : 999) - (patByLabel.get(b) ? patByLabel.get(b).slot : 999) || (a < b ? -1 : 1))) { const o = document.createElement("option"); o.value = l; o.textContent = l; sel.appendChild(o); }
  sel.value = cue.label;
  time.value = mmss(cue.t - OFFSET); time.size = 7; time.title = "the time (m:ss.s)";
  const apply = () => { cues.sort((a, b) => a.t - b.t); rebuildCues(); saveCues(); };
  sel.onchange = () => { const n = cueFor(sel.value, cue.t); cue.label = n.label; cue.pattern = n.pattern; cue.pads = n.pads; apply(); };
  time.onchange = () => { cue.t = +(parseTime(time.value) + OFFSET).toFixed(3); apply(); };
  const step = dir => () => {
    const ls = loopStarts.slice().sort((a, b) => a - b), t = dir < 0 ? [...ls].reverse().find(l => l < cue.t - 0.05) : ls.find(l => l > cue.t + 0.05);
    cue.t = +(t !== undefined ? t : cue.t + dir * 0.1).toFixed(3); time.value = mmss(cue.t - OFFSET); apply();
  };
  const mk = (txt, title, fn) => { const b = document.createElement("button"); b.textContent = txt; b.title = title; b.onclick = fn; return b; };
  const seek = mk("go", "play from here", () => { audio.currentTime = Math.max(cue.t - OFFSET - 1, 0); });
  pop.append(sel, time, mk("<", "to the loop start before", step(-1)), mk(">", "to the loop start after", step(1)), seek,
    mk("delete", "remove this change", () => { cues = cues.filter(c => c !== cue); pop.classList.remove("open"); apply(); }),
    mk("x", "close", () => pop.classList.remove("open")));
  const box = document.getElementById("cues").getBoundingClientRect(), x = box.left + (cue.t - OFFSET) / (AN ? AN.duration : 1) * box.width;
  pop.style.left = clamp(x - 150, 8, innerWidth - 340) + "px";
}
// the pattern changes at the start of a loop: a cue is put on the loop start nearest to the time
function snapLoop(T) {
  let best = T, bd = 1.9;
  for (const l of loopStarts) { const d = Math.abs(l - T); if (d < bd) { bd = d; best = l; } }
  return best;
}

const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
// the last item of a sorted list with t <= T (or null)
function at(list, T) {
  let lo = 0, hi = list.length - 1, r = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (list[m].t <= T) { r = m; lo = m + 1; } else hi = m - 1; }
  return r < 0 ? null : list[r];
}
function atIndex(list, T) {
  let lo = 0, hi = list.length - 1, r = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (list[m].t <= T) { r = m; lo = m + 1; } else hi = m - 1; }
  return r;
}
const push = (map, key, v) => { if (!map.has(key)) map.set(key, []); map.get(key).push(v); };

function prepare(events, analysis, cuesIn, adoptedIn) {
  EV = events; AN = analysis;
  const timed = EV.filter(e => e.t !== undefined);
  const ps = [...timed].reverse().find(e => e.k === "project"); // the last: the unit's own project when it was read
  if (ps) PROJ = ps.data;
  for (const p of PROJ.pads || []) padInfo.set(p.n, p);
  for (const p of PROJ.patterns || []) { patBySlot.set(p.slot, p); patByLabel.set(p.label, p); p.pads = new Set(p.notes.map(n => n[1])); }
  const a = timed.find(e => e.k === "audio_start");
  OFFSET = a ? a.t : 0;
  for (const e of timed) {
    switch (e.k) {
      case "on": case "off": if (e.bank) push(padEv, e.bank + e.pad, { t: e.t, on: e.k === "on", v: e.v || 0 }); else if (e.k === "on") otherNotes.push({ t: e.t, ch: e.ch, n: e.n, v: e.v }); break;
      case "cc": push(ccEv, e.ch + ":" + e.n, { t: e.t, v: e.v }); break;
      case "fx": if (e.fx !== undefined) push(fxNum, e.bus, { t: e.t, v: e.fx }); else push(fxOn, e.bus, { t: e.t, v: e.on }); break;
      case "beat": beats.push({ t: e.t, n: e.n, bpm: e.bpm }); break;
      case "start": case "stop": case "continue": transport.push({ t: e.t, k: e.k }); break;
      case "pattern": patRaw.push(e); break;
      case "mute": push(muteEv, e.bank + e.pad, { t: e.t, on: e.on }); break;
      case "isolate": isoEv.push({ t: e.t, keep: new Set(e.keep || []), dry: new Set(e.dry || []), buses: e.buses || [] }); break;
    }
    if (e.k === "on" && e.ch === 13 && e.n === 48) loopStarts.push(e.t);
  }
  // the pattern events: a pattern that was only asked for ("next", the unit has it from the end of its loop) plays from the next loop start
  const known = l => l && l !== "—" && l !== "-";
  for (const e of patRaw) {
    if (known(e.now)) { if (!patEv.length || patEv[patEv.length - 1].now !== e.now) patEv.push({ t: e.t, now: e.now, next: "" }); }
    else if (known(e.next) && (e.sent || !known(e.now))) {
      const ls = loopStarts.find(l => l >= e.t - 0.05 && l < e.t + 12);
      const t = ls !== undefined ? ls : e.t;
      if (!patEv.length || patEv[patEv.length - 1].now !== e.next) patEv.push({ t, now: e.next, next: "" });
    }
  }
  patEv.sort((a, b) => a.t - b.t);
  adopted = !!adoptedIn;
  cues = (cuesIn || []).map(c => ({ t: c.t, label: c.label, pattern: c.pattern, pads: c.pads }));
  for (const c of cues) { // what the cue kept of the pattern and its pads stands in for a project that has no (or another) one
    if (c.pattern && !patByLabel.has(c.label)) { const p = c.pattern; p.pads = new Set(p.notes.map(n => n[1])); patBySlot.set(p.slot, p); patByLabel.set(p.label, p); }
    for (const pd of c.pads || []) if (!padInfo.has(pd.n)) padInfo.set(pd.n, pd);
  }
  rebuildCues();
  const bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const sel = document.getElementById("pat");
  for (const p of [...patBySlot.values()].sort((a, b) => a.slot - b.slot)) { const o = document.createElement("option"); o.value = p.label; o.textContent = "pattern " + p.label + " (" + p.pads.size + " pads)"; sel.appendChild(o); }
  const want = params.get("pattern");
  const ti = document.getElementById("title"); ti.value = TITLE;
  let tt = null; ti.oninput = () => { TITLE = ti.value; clearTimeout(tt); tt = setTimeout(() => fetch("/title", { method: "POST", body: JSON.stringify({ title: TITLE }) }).catch(() => {}), 400); };
  if (want && patByLabel.has(want)) { chosen = want; sel.value = want; }
  sel.onchange = () => {
    if (!sel.value) return;
    const T = snapLoop(now() + OFFSET + NUDGE / 1000);

      f.onfocus = () => { audio.currentTime = c.from; };
      del.onclick = () => { CAPS.splice(i, 1); save(); render(); };
      row.append(f, t, x, del); list.appendChild(row);
    });
  };
  const fadeIn = document.getElementById("c_fade"), lenIn = document.getElementById("c_len");
  const blurIn = document.getElementById("c_blur"), dimIn = document.getElementById("c_dim");
  const showSettings = () => {
    fadeIn.value = STYLE.capFade; lenIn.value = STYLE.capLength; blurIn.value = STYLE.capBlur; dimIn.value = Math.round(STYLE.capDim * 100);
    document.getElementById("c_blurv").textContent = (+blurIn.value).toFixed(1) + " px"; document.getElementById("c_dimv").textContent = dimIn.value + " %";
  };
  const keepSettings = () => {
    STYLE.capFade = Math.max(0, Math.min(3, parseFloat(fadeIn.value) || 0)); STYLE.capLength = Math.max(1, parseFloat(lenIn.value) || 5);
    STYLE.capBlur = parseFloat(blurIn.value) || 0; STYLE.capDim = (parseFloat(dimIn.value) || 0) / 100;
    document.getElementById("c_blurv").textContent = STYLE.capBlur.toFixed(1) + " px"; document.getElementById("c_dimv").textContent = Math.round(STYLE.capDim * 100) + " %";
    window.styleChanged && window.styleChanged();
  };
  fadeIn.oninput = lenIn.oninput = blurIn.oninput = dimIn.oninput = keepSettings;
  const lane = () => { // the captions as blocks under the patterns: click one to edit it
    const el = document.getElementById("capslane"); el.textContent = ""; const d = AN ? AN.duration : 0; if (!d) return;
    const place = (b, c) => { const x0 = clamp(c.from / d, 0, 1), x1 = clamp(c.to / d, 0, 1); b.style.left = x0 * 100 + "%"; b.style.width = Math.max(x1 - x0, 0.004) * 100 + "%"; };
    // a block moves by its body and is made longer or shorter by its edges; a time near a loop start snaps to it
    const drag = (ev, b, mode, c) => {
      ev.preventDefault(); ev.stopPropagation(); try { b.setPointerCapture(ev.pointerId); } catch (e) { /* a pointer that is gone */ }
      const w = el.getBoundingClientRect().width, x0 = ev.clientX, f0 = c.from, t0 = c.to; let moved = false;
      const snap = t => { let best = t, bd = 0.2; for (const l of loopStarts) { const dd = Math.abs(l - OFFSET - t); if (dd < bd) { bd = dd; best = l - OFFSET; } } return +best.toFixed(2); };
      b.onpointermove = e => {
        if (!moved && Math.abs(e.clientX - x0) < 3) return;
        moved = true; b._moved = true;
        const dt = (e.clientX - x0) / w * d;
        if (mode === "move") { const len = t0 - f0, nf = clamp(snap(f0 + dt), 0, d - len); c.from = nf; c.to = +(nf + len).toFixed(2); }
        else if (mode === "l") c.from = clamp(snap(f0 + dt), 0, c.to - 0.3);
        else c.to = clamp(snap(t0 + dt), c.from + 0.3, d);
        place(b, c);
      };
      b.onpointerup = () => { b.onpointermove = b.onpointerup = null; if (moved) { save(); render(); lane(); } };
    };
    CAPS.slice().sort((a, b) => a.from - b.from).forEach((c, i) => {
      const b = document.createElement("div"), hl = document.createElement("span"), hr = document.createElement("span");
      b.className = "cap"; b.textContent = c.text || "(empty)"; b.title = mmss(c.from) + " - " + mmss(c.to) + ": " + c.text + " (drag to move, the edges change the length, click to edit)";
      hl.className = "hd l"; hr.className = "hd r"; b.append(hl, hr);
      place(b, c);
      hl.onpointerdown = ev => drag(ev, b, "l", c); hr.onpointerdown = ev => drag(ev, b, "r", c); b.onpointerdown = ev => { if (ev.target === b) drag(ev, b, "move", c); };
      b.onclick = () => {
        if (b._moved) { b._moved = false; return; }
        showSettings(); box.classList.add("open"); render(); const rows = list.querySelectorAll("input.x"); if (rows[i]) { rows[i].focus(); rows[i].scrollIntoView({ block: "nearest" }); } audio.currentTime = c.from;
      };
      el.appendChild(b);
    });
  };
  window.refreshCapLane = lane;
  document.getElementById("capbtn").onclick = () => { showSettings(); box.classList.toggle("open"); render(); };
  document.getElementById("capadd").onclick = () => {
    const a = now(), d = AN ? AN.duration : a + 5;
    CAPS.push({ from: +a.toFixed(1), to: +Math.min(a + (+STYLE.capLength || 5), d).toFixed(1), text: "" }); save(); render();
    const inputs = list.querySelectorAll("input.x"); if (inputs.length) inputs[inputs.length - 1].focus();
  };
  render(); lane();
}

// the controls of the look
function mergeStyle(saved) {
  const st = JSON.parse(JSON.stringify(STYLE_DEFAULT));
  if (saved && Array.isArray(saved.busNotes)) saved.busNotes = [0, 1, 2, 3].map(i => String(saved.busNotes[i] || ""));
  if (saved && typeof saved === "object") { Object.assign(st, saved); st.bg = Object.assign({}, STYLE_DEFAULT.bg, saved.bg || {}); }
  return st;
}
function initStyle(saved) {
  STYLE = mergeStyle(saved);
  const q = params.get("preset"); if (q && PRESETS[q]) STYLE.preset = q;
  if (validHex(params.get("accent"))) STYLE.accent = params.get("accent");
  if (params.get("handle")) STYLE.handle = params.get("handle");
  if (params.get("subtitle")) STYLE.subtitle = params.get("subtitle");
  if (validHex(params.get("bgcolor"))) STYLE.bg = Object.assign({}, STYLE.bg, { kind: "solid", color: params.get("bgcolor") });
  applyStyle();
  const $ = id => document.getElementById(id), box = $("stylebox"), sel = $("s_preset");
  for (const k of Object.keys(PRESETS)) { const o = document.createElement("option"); o.value = k; o.textContent = k; sel.appendChild(o); }
  const show = () => {
    sel.value = STYLE.preset; $("s_accent").value = validHex(STYLE.accent) ? STYLE.accent : (PRESETS[STYLE.preset] || PRESETS["404 dark"]).accent;
    $("s_bgkind").value = STYLE.bg.kind; $("s_bg1").value = validHex(STYLE.bg.color) ? STYLE.bg.color : "#000000"; $("s_bg2").value = validHex(STYLE.bg.color2) ? STYLE.bg.color2 : "#1b1b2e";
    for (let i = 0; i < 4; i++) {
      const note = (STYLE.busNotes || [])[i] || "", sl = $("s_bussel" + i), inp = $("s_bus" + i), known = [...sl.options].some(o => o.value === note && o.value !== "__custom__");
      sl.value = !note ? "" : known ? note : "__custom__"; inp.hidden = sl.value !== "__custom__"; inp.value = known ? "" : note;
    }
    $("s_bgdim").value = Math.round((STYLE.bg.dim === undefined ? 0.6 : STYLE.bg.dim) * 100); $("s_handle").value = STYLE.handle || ""; $("s_sub").value = STYLE.subtitle || "";
  };
  show();
  let timer = null;
  const changed = window.styleChanged = () => { applyStyle(); clearTimeout(timer); timer = setTimeout(() => fetch("/style", { method: "POST", body: JSON.stringify(STYLE) }).catch(() => {}), 500); };
  $("stylebtn").onclick = () => box.classList.toggle("open");
  sel.onchange = () => { STYLE.preset = sel.value; STYLE.accent = ""; show(); changed(); };
  $("s_accent").oninput = () => { STYLE.accent = $("s_accent").value; changed(); };
  $("s_accent_auto").onclick = () => { STYLE.accent = ""; show(); changed(); };
  $("s_bgkind").onchange = () => { STYLE.bg.kind = $("s_bgkind").value; changed(); };
  $("s_bg1").oninput = () => { STYLE.bg.color = $("s_bg1").value; if (STYLE.bg.kind === "preset") STYLE.bg.kind = "solid"; show(); changed(); };
  $("s_bg2").oninput = () => { STYLE.bg.color2 = $("s_bg2").value; STYLE.bg.kind = "gradient"; show(); changed(); };
  $("s_bgdim").oninput = () => { STYLE.bg.dim = $("s_bgdim").value / 100; changed(); };
  // what each bus is used for: one of the unit's effects, or your own text
  const allFx = [...new Set([...((window.SP404_FX || {}).fx12 || []), ...((window.SP404_FX || {}).fx34 || [])])]; // every effect, on any bus
  const fxLists = [allFx, allFx, allFx, allFx];
  const setNotes = () => { STYLE.busNotes = [0, 1, 2, 3].map(k => { const v = $("s_bussel" + k).value; return v === "__custom__" ? $("s_bus" + k).value : v; }); changed(); };
  for (let i = 0; i < 4; i++) {
    const sl = $("s_bussel" + i);
    let into = sl;
    const group = t => { into = document.createElement("optgroup"); into.label = t; sl.appendChild(into); };
    const add = (v, t) => { const o = document.createElement("option"); o.value = v; o.textContent = t; into.appendChild(o); };
    add("", "not set");
    group("kinds"); for (const k of ["Direct FX 1-5", "Reverb", "Delay", "Filter", "Drive / distortion", "Lo-fi", "Modulation", "Looper / scatter", "Resample"]) add(k, k);
    group("the unit's effects"); for (const n of fxLists[i]) if (n && n !== "(OFF)") add(n, n);
    group("other"); add("__custom__", "my own text...");
    sl.onchange = () => { $("s_bus" + i).hidden = sl.value !== "__custom__"; if (!$("s_bus" + i).hidden) $("s_bus" + i).focus(); setNotes(); };
    $("s_bus" + i).oninput = setNotes;
  }
  show();
  $("s_handle").oninput = () => { STYLE.handle = $("s_handle").value; changed(); };
  $("s_sub").oninput = () => { STYLE.subtitle = $("s_sub").value; changed(); };
  // pictures are made small before they are kept (a logo 480 px wide, a background 1920 px), so that the file beside the log stays small
  const picture = (file, maxW, type, done) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, maxW / img.naturalWidth), c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); done(c.toDataURL(type, 0.84)); };
    img.src = url;
  };
  $("s_logo").onchange = e => { const f = e.target.files[0]; if (f) picture(f, 480, "image/png", d => { STYLE.logo = d; changed(); }); };
  $("s_logo_clear").onclick = () => { STYLE.logo = ""; changed(); };
  $("s_bgimg").onchange = e => { const f = e.target.files[0]; if (f) picture(f, 1920, "image/jpeg", d => { STYLE.bg.image = d; STYLE.bg.kind = "image"; show(); changed(); }); };
  $("s_reset").onclick = () => { STYLE = JSON.parse(JSON.stringify(STYLE_DEFAULT)); show(); changed(); };
}

async function start() {
  const msg = document.getElementById("msg");
  try {
    const [ev, an] = await Promise.all([fetch("/events.json").then(r => r.json()), fetch("/analysis.json").then(r => r.json())]);
    FILE = ev.file; TITLE = params.get("title") || ev.title || ""; CAPS = (ev.captions || []).map(c => ({ from: +c.from || 0, to: +c.to || 0, text: String(c.text || "") })); initStyle(ev.style); initCaptions(); prepare(ev.events, an, ev.cues, ev.adopted);
  } catch (e) { msg.textContent = "could not load the replay: " + e; msg.style.display = "block"; return; }
  const t0 = parseFloat(params.get("t") || "0");
  if (t0) audio.currentTime = t0;
  // for a render: window.replay.setTime(t) draws the frame of that time and nothing moves by itself
  window.replay = { duration: AN.duration, fps: AN.fps, offset: OFFSET, setTime(t) { manual = t; draw(t); return true; }, release() { manual = null; }, draw,
    // for a render: the pictures of the look have loaded, and the picture of a time (a PNG as a data URL)
    ready() { return (!logoImg || logoImg.complete) && (!bgImg || bgImg.complete); },
    frame(t) { manual = t; draw(t); return cv.toDataURL("image/png"); } };
  window.replayReady = true;
  if (params.get("t") !== null && params.get("play") === null) manual = t0;
  frame();
}
{ // the pop-ups sit above the bar, whatever its height
  const bar = document.getElementById("bar"), set = () => document.documentElement.style.setProperty("--barh", bar.offsetHeight + "px");
  set(); if (window.ResizeObserver) new ResizeObserver(set).observe(bar); addEventListener("resize", set);
}
start();
