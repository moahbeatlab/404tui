<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404tui replay</title>
<style>
  :root { --bg:#121214; --panel:#1b1b1e; --amber:#ffb000; --text:#ddd; --dim:#888; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px ui-monospace, Menlo, Consolas, monospace; }
  body { display:flex; flex-direction:column; }
  #stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  canvas { width:100%; height:100%; object-fit:contain; background:#121214; }
  #bar { display:flex; gap:12px; align-items:center; padding:8px 16px; background:#161616; border-top:1px solid #2a2a2a; }
  #bar input { background:#2b2b2b; color:var(--text); border:0; padding:6px 10px; font:inherit; }
  #bar button, #bar select { background:#2b2b2b; color:var(--text); border:0; padding:6px 12px; font:inherit; cursor:pointer; }
  #bar button:hover { background:#3a3a3a; }
  #seekbox { flex:1; position:relative; display:flex; }
  #seek { flex:1; accent-color:var(--amber); }
  #cues { position:absolute; left:8px; right:8px; top:-12px; height:12px; pointer-events:none; }
  #cues span { position:absolute; transform:translateX(-50%); background:var(--amber); color:#000; font-size:10px; padding:0 3px; cursor:pointer; pointer-events:auto; }
  #time { min-width:150px; text-align:right; color:var(--dim); }
  #nudge { color:var(--dim); min-width:110px; }
  body.nohud #bar { display:none; }
  #msg { position:fixed; left:50%; top:45%; transform:translateX(-50%); background:#2b2b2b; padding:16px 24px; display:none; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="bar">
  <button id="play" title="Space">play</button>
  <div id="seekbox"><div id="cues"></div><input id="seek" type="range" min="0" max="1000" value="0"></div>
  <span id="time">0:00.0</span>
  <input id="title" placeholder="title" size="16" title="the title shown in the video">
  <select id="pat" title="the pattern that plays from here on (at the next loop start): the unit did not say"><option value="">pattern from here...</option></select><button id="clearcues" title="remove all the patterns set by hand">clear</button>
  <select id="speed" title="speed"><option>0.25</option><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option></select>
  <span id="nudge" title="[ and ] move the events against the sound by 10 ms">sync +0 ms</span>
  <button id="full" title="f">full screen</button>
</div>
<div id="msg"></div>
<audio id="audio" preload="auto" src="/audio"></audio>
<script src="/fxdata.js"></script>
<script>
"use strict";
// ---- the page of a replay: everything on the screen is a function of the time, so that it can be watched (the audio drives the time)
// and rendered frame by frame (a program sets the time: window.replay.setTime(t)).
// the colours of 404jam (src/styles/main.css), so that the replay looks like the rest of the family
const COL = { bg:"#121214", panel:"#1b1b1e", tile:"#2c2c30", tile2:"#1d1d20", amber:"#ffb000", amberD:"#7a5a00", text:"#ececf0", dim:"#9a9aa4", line:"#34343a",
              good:"#87d787", bad:"#ff5f5f", blue:"#5fafff", red:"#ff3b30", green:"#3ddc84", gold:"#ffb300", purple:"#c792ea" };
const BUSCOL = { 1: COL.blue, 2: COL.red, 3: COL.green, 4: COL.gold };
const FONT = (px, bold) => (bold ? "bold " : "") + px + "px ui-monospace, Menlo, Consolas, monospace";
const cv = document.getElementById("c"), g = cv.getContext("2d");
const params = new URLSearchParams(location.search);
// ?format=vertical (shorts, reels: 1080x1920) lays the same panels one under the other
const VERT = ["vertical", "shorts", "reels", "9x16"].includes(params.get("format") || "");
if (VERT) { cv.width = 1080; cv.height = 1920; }
const W = cv.width, H = cv.height;
// where every panel is: [x, y, w, h]. The bottom of a vertical frame is left free for what the platforms put over it.
const L = VERT
  ? { pads: [20, 108, 1040, 540], pattern: [20, 660, 1040, 350], fx: [20, 1022, 1040, 220], meter: [20, 1254, 1040, 270], feed: [20, 1536, 1040, 168] }
  : { pads: [40, 80, 880, 560], pattern: [40, 656, 880, 394], fx: [960, 80, 920, 236], meter: [960, 332, 920, 452], feed: [960, 800, 920, 250] };
if (params.get("hud") === "0") document.body.classList.add("nohud");

let TITLE = "", EV = [], AN = null, PROJ = { pads: [], patterns: [] }, FILE = "", OFFSET = 0, NUDGE = 0;
const padInfo = new Map(), patBySlot = new Map(), patByLabel = new Map();
const otherNotes = [], padEv = new Map(), ccEv = new Map(), fxNum = new Map(), fxOn = new Map(), beats = [], transport = [], patEv = [];
let peak = null, spec = null, lastHit = [];
const loopStarts = []; // the unit marks every loop of the pattern with a note (channel 13, note 48)
let cues = [];         // the patterns set by hand: { t (time of the log), label }, kept by the server beside the event log
const recordedPat = [];
function rebuildCues() {
  if (!recordedPat.length) recordedPat.push(...patEv);
  patEv.length = 0;
  patEv.push(...recordedPat, ...cues.map(c => ({ t: c.t, now: c.label, next: "", cue: true })));
  patEv.sort((a, b) => a.t - b.t);
  const box = document.getElementById("cues"); if (!box) return;
  box.textContent = "";
  const d = AN ? AN.duration : 0;
  for (const c of cues) {
    if (!d) break;
    const sp = document.createElement("span"); sp.textContent = c.label; sp.title = "click to remove this cue";
    sp.style.left = clamp((c.t - OFFSET) / d * 100, 0, 100) + "%";
    sp.onclick = () => { cues = cues.filter(x => x !== c); rebuildCues(); saveCues(); };
    box.appendChild(sp);
  }
}
function saveCues() { fetch("/cues", { method: "POST", body: JSON.stringify(cues) }).catch(() => {}); }
// the pattern changes at the start of a loop: a cue is put on the loop start nearest to the time
function snapLoop(T) {
  let best = T, bd = 1.9;
  for (const l of loopStarts) { const d = Math.abs(l - T); if (d < bd) { bd = d; best = l; } }
  return best;
}

const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
// the last item of a sorted list with t <= T (or null)
function at(list, T) {
  let lo = 0, hi = list.length - 1, r = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (list[m].t <= T) { r = m; lo = m + 1; } else hi = m - 1; }
  return r < 0 ? null : list[r];
}
function atIndex(list, T) {
  let lo = 0, hi = list.length - 1, r = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (list[m].t <= T) { r = m; lo = m + 1; } else hi = m - 1; }
  return r;
}
const push = (map, key, v) => { if (!map.has(key)) map.set(key, []); map.get(key).push(v); };

function prepare(events, analysis, cuesIn) {
  EV = events; AN = analysis;
  const timed = EV.filter(e => e.t !== undefined);
  const ps = [...timed].reverse().find(e => e.k === "project"); // the last: the unit's own project when it was read
  if (ps) PROJ = ps.data;
  for (const p of PROJ.pads || []) padInfo.set(p.n, p);
  for (const p of PROJ.patterns || []) { patBySlot.set(p.slot, p); patByLabel.set(p.label, p); p.pads = new Set(p.notes.map(n => n[1])); }
  const a = timed.find(e => e.k === "audio_start");
  OFFSET = a ? a.t : 0;
  for (const e of timed) {
    switch (e.k) {
      case "on": case "off": if (e.bank) push(padEv, e.bank + e.pad, { t: e.t, on: e.k === "on", v: e.v || 0 }); else if (e.k === "on") otherNotes.push({ t: e.t, ch: e.ch, n: e.n, v: e.v }); break;
      case "cc": push(ccEv, e.ch + ":" + e.n, { t: e.t, v: e.v }); break;
      case "fx": if (e.fx !== undefined) push(fxNum, e.bus, { t: e.t, v: e.fx }); else push(fxOn, e.bus, { t: e.t, v: e.on }); break;
      case "beat": beats.push({ t: e.t, n: e.n, bpm: e.bpm }); break;
      case "start": case "stop": case "continue": transport.push({ t: e.t, k: e.k }); break;
      case "pattern": patEv.push({ t: e.t, now: e.now, next: e.next }); break;
    }
    if (e.k === "on" && e.ch === 13 && e.n === 48) loopStarts.push(e.t);
  }
  cues = (cuesIn || []).map(c => ({ t: c.t, label: c.label, pattern: c.pattern, pads: c.pads }));
  for (const c of cues) { // what the cue kept of the pattern and its pads stands in for a project that has no (or another) one
    if (c.pattern && !patByLabel.has(c.label)) { const p = c.pattern; p.pads = new Set(p.notes.map(n => n[1])); patBySlot.set(p.slot, p); patByLabel.set(p.label, p); }
    for (const pd of c.pads || []) if (!padInfo.has(pd.n)) padInfo.set(pd.n, pd);
  }
  rebuildCues();
  const bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const sel = document.getElementById("pat");
  for (const p of [...patBySlot.values()].sort((a, b) => a.slot - b.slot)) { const o = document.createElement("option"); o.value = p.label; o.textContent = "pattern " + p.label + " (" + p.pads.size + " pads)"; sel.appendChild(o); }
  const want = params.get("pattern");
  const ti = document.getElementById("title"); ti.value = TITLE;
  let tt = null; ti.oninput = () => { TITLE = ti.value; clearTimeout(tt); tt = setTimeout(() => fetch("/title", { method: "POST", body: JSON.stringify({ title: TITLE }) }).catch(() => {}), 400); };
  if (want && patByLabel.has(want)) { chosen = want; sel.value = want; }
  sel.onchange = () => {
    if (!sel.value) return;
    const T = snapLoop(now() + OFFSET + NUDGE / 1000);
    cues = cues.filter(c => Math.abs(c.t - T) > 0.05);
    const p = patByLabel.get(sel.value);
    cues.push({ t: +T.toFixed(3), label: sel.value,
      pattern: p ? { slot: p.slot, label: p.label, bars: p.bars, length: p.length, notes: p.notes } : undefined,
      pads: p ? [...p.pads].map(n => padInfo.get(n)).filter(Boolean) : undefined });
    sel.value = ""; rebuildCues(); saveCues();
  };
  document.getElementById("clearcues").onclick = () => { cues = []; rebuildCues(); saveCues(); };
  if (AN && AN.frames) { peak = new Uint16Array(bytes(AN.peak).buffer); spec = bytes(AN.spec); }
  for (const [k, l] of padEv) hitTimes.set(k, l.filter(e => e.on).map(e => ({ t: e.t })));
  for (const e of beats) if (e.bpm) tempoSeries.push(e);
  buildFeed(timed);
}
// ---- the feed: what happens, for a moment (pads pressed, knobs moved, effects, the clock, the pattern)
const feedStatic = [];
function buildFeed(timed) {
  for (const [k, l] of padEv) for (const e of l) if (e.on) feedStatic.push({ t: e.t, text: k + " pressed", val: "v" + e.v, col: COL.amber });
  for (const e of timed) {
    if (e.k === "cc") {
      const bus = e.ch >= 1 && e.ch <= 4 && ((e.n >= 16 && e.n <= 18) || (e.n >= 80 && e.n <= 82));
      if (bus) feedStatic.push({ t: e.t, key: "cc" + e.ch + ":" + e.n, text: "BUS " + e.ch + " CTRL " + (e.n < 30 ? e.n - 15 : e.n - 79), val: String(e.v), col: BUSCOL[e.ch] });
      else if (e.n !== 83 && e.n !== 19) feedStatic.push({ t: e.t, key: "cc" + e.ch + ":" + e.n, text: "CC " + e.n + " ch " + e.ch, val: String(e.v), col: COL.dim });
    } else if (e.k === "fx") {
      if (e.fx !== undefined) feedStatic.push({ t: e.t, text: "BUS " + e.bus + " effect", val: ((window.SP404_FX || {})[e.bus >= 3 ? "fx34" : "fx12"] || [])[e.fx] || String(e.fx), col: BUSCOL[e.bus] });
      else feedStatic.push({ t: e.t, text: "BUS " + e.bus + " FX", val: e.on ? "ON" : "OFF", col: BUSCOL[e.bus] });
    } else if (e.k === "on" && !e.bank) {
      feedStatic.push({ t: e.t, text: e.ch === 13 && e.n === 48 ? "loop start" : "MIDI note " + e.n + " ch " + e.ch, val: e.ch === 13 && e.n === 48 ? "" : "v" + e.v, col: COL.dim });
    } else if (e.k === "start" || e.k === "stop" || e.k === "continue") feedStatic.push({ t: e.t, text: e.k.toUpperCase(), val: "", col: COL.good });
  }
  feedStatic.sort((a, b) => a.t - b.t);
}
const FEED_SPAN = 4.5;
function drawFeed(T) {
  const [x0, y0, w, h] = L.feed;
  panel(x0, y0, w, h, "EVENTS");
  const items = [];
  let i = atIndex(feedStatic, T);
  for (; i >= 0 && feedStatic[i].t > T - FEED_SPAN; i--) items.push(feedStatic[i]);
  for (const e of patEv) if (e.now && e.t <= T && e.t > T - FEED_SPAN) items.push({ t: e.t, text: "PATTERN", val: e.now, col: COL.purple });
  items.sort((a, b) => b.t - a.t);
  const seen = new Set(), out = []; // a knob that moves is one line: its latest value
  for (const it of items) { if (it.key) { if (seen.has(it.key)) continue; seen.add(it.key); } out.push(it); if (out.length >= Math.floor((h - 52) / 28)) break; }
  out.forEach((it, k) => {
    const age = T - it.t, y = y0 + 44 + k * 28;
    g.globalAlpha = clamp(1 - Math.pow(age / FEED_SPAN, 2), 0, 1);
    rect(x0 + 20, y + 2, 5, 20, it.col);
    text(it.text, x0 + 36, y + 20, COL.text, 20, true);
    text(it.val, x0 + w - 24, y + 20, it.col, 20, true, "right");
    g.globalAlpha = 1;
  });
}

const hitTimes = new Map(), tempoSeries = [];

// ---- what the unit was doing at time T (the time of the log)
function padState(bank, pad, T) {
  const l = padEv.get(bank + pad); if (!l) return null;
  const i = atIndex(l, T); if (i < 0) return null;
  let on = null;
  for (let j = i; j >= 0 && j > i - 8; j--) { if (l[j].on) { on = l[j]; break; } }
  return { held: l[i].on, hitAt: on ? on.t : -1, v: on ? on.v : 0 };
}
function ccValue(ch, n, T) { const e = at(ccEv.get(ch + ":" + n) || [], T); return e ? e.v : null; }
function ccHistory(ch, n, T, span) {
  const l = ccEv.get(ch + ":" + n); if (!l) return [];
  const i = atIndex(l, T), out = [];
  for (let j = i; j >= 0 && l[j].t >= T - span; j--) out.unshift(l[j]);
  return out;
}
const fxName = (bus, T) => {
  const e = at(fxNum.get(bus) || [], T); if (!e) return null;
  const list = (window.SP404_FX || {})[bus >= 3 ? "fx34" : "fx12"] || [];
  return list[e.v] || ("effect " + e.v);
};
function bankInView(T) {
  let best = -1, bank = "A";
  for (const [k, l] of padEv) { const e = at(l, T); if (e && e.t > best) { best = e.t; bank = k[0]; } }
  if (best < 0 || T - best > 3) { // no pad was touched lately: the bank of the pattern that plays
    const r = patternAt(T);
    if (r && r.p.pads.size) {
      bank = patternBank(r.p) || bank;
    }
  }
  return bank;
}
function playPosition(T) {
  const i = atIndex(beats, T); if (i < 0) return null;
  const b = beats[i]; if (T - b.t > 2.5) return null; // the clock stopped
  return { q: b.n + clamp((T - b.t) * b.bpm / 60, 0, 1), bpm: b.bpm };
}
// the tempo is in the project: the one of the bank of the pattern that plays (or the project's when the banks share it); the clock only
// shows where in the bar the unit is, and stands in when the project does not say
function bankTempo(letter) {
  const bt = PROJ.bank_tempos;
  if (bt && !PROJ.project_tempo && bt[letter.charCodeAt(0) - 65]) return bt[letter.charCodeAt(0) - 65];
  return PROJ.tempo || 0;
}
function patternBank(p) {
  const n = new Map(); for (const pad of p.pads) { const b = Math.floor(pad / 16); n.set(b, (n.get(b) || 0) + 1); }
  return n.size ? String.fromCharCode(65 + [...n].sort((a, b) => b[1] - a[1])[0][0]) : "";
}
function tempoAt(T) {
  const r = patternAt(T), pos = playPosition(T);
  if (r) { const b = patternBank(r.p), t = b ? bankTempo(b) : 0; if (t) return { bpm: t, src: "bank " + b }; }
  if (pos) return { bpm: pos.bpm, src: "clock" };
  return { bpm: PROJ.tempo || 0, src: "project" };
}
function running(T) { const e = at(transport, T); return e ? e.k !== "stop" : !!playPosition(T); }

let sticky = null, chosen = null;
function patternAt(T) {
  if (chosen && patByLabel.has(chosen)) return { p: patByLabel.get(chosen), how: "chosen" };
  const e = at(patEv, T);
  if (e && e.now && patByLabel.has(e.now)) return { p: patByLabel.get(e.now), how: e.cue ? "cue" : "known" };
  // no word from the unit: the pattern whose pads are the ones just heard
  const pos = playPosition(T), bpm = pos ? pos.bpm : 120;
  const hits = new Set();
  for (const [k, l] of padEv) {
    const i = atIndex(l, T);
    for (let j = i; j >= 0 && l[j].t >= T - 8 * 60 / bpm; j--) if (l[j].on) { hits.add((k.charCodeAt(0) - 65) * 16 + parseInt(k.slice(1), 10) - 1); break; }
  }
  if (!hits.size) return sticky ? { p: sticky, how: "guess" } : null;
  let best = null, bs = 0.5;
  for (const p of patBySlot.values()) {
    let inter = 0; for (const h of hits) if (p.pads.has(h)) inter++;
    const score = inter / hits.size - 0.2 * (p.pads.size - inter) / Math.max(p.pads.size, 1);
    if (score > bs) { bs = score; best = p; }
  }
  if (best) sticky = best;
  return sticky ? { p: sticky, how: "guess" } : null;
}

// ---- drawing
function rect(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function rrect(x, y, w, h, r, c) { g.fillStyle = c; g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); }
function text(s, x, y, c, px, bold, align) { g.fillStyle = c; g.font = FONT((px || 22) * (VERT ? 1.22 : 1), bold); g.textAlign = align || "left"; g.textBaseline = "alphabetic"; g.fillText(s, x, y); }
function fit(s, n) { return s.length > n ? s.slice(0, n - 1) + "~" : s; }
const mix = (c1, c2, t) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const a = p(c1), b = p(c2); return "rgb(" + a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(",") + ")"; };
function panel(x, y, w, h, title) { rrect(x, y, w, h, 12, COL.panel); if (title) text(title, x + 16, y + 30, COL.dim, 20, true); }
const mmss = t => { t = Math.max(t, 0); return Math.floor(t / 60) + ":" + (t % 60).toFixed(1).padStart(4, "0"); };

function drawHeader(T, A) {
  const pos = playPosition(T), run = running(T);
  const bar = pos ? Math.floor(pos.q / 4) + 1 : null, beat = pos ? Math.floor(pos.q % 4) + 1 : null;
  const tp = tempoAt(T), bpm = tp.bpm, bpmText = bpm ? (Number.isInteger(bpm) ? bpm : bpm.toFixed(1)) + " BPM" : "";
  const dur = AN ? AN.duration : 0, name = TITLE || PROJ.name || "";
  if (VERT) {
    rect(0, 0, W, 100, "#161616");
    text(fit(name, 30), 24, 44, TITLE ? COL.text : COL.amber, 32, true);
    text(mmss(A) + " / " + mmss(dur), W - 24, 44, COL.dim, 22, false, "right");
    text(bpmText, 24, 86, tp.src === "project" ? COL.dim : COL.amber, 34, true);
    text(pos ? "BAR " + bar + "  BEAT " + beat : "", 300, 84, COL.text, 24);
    text(run ? "PLAY" : "STOP", W - 24, 84, run ? COL.good : COL.dim, 26, true, "right");
    return;
  }
  rect(0, 0, W, 64, "#161616");
  text("404tui", 28, 42, COL.amber, 30, true);
  text("REPLAY", 150, 42, COL.text, 26, true);
  if (TITLE) text(fit(TITLE, 34), 300, 44, COL.text, 30, true);
  else text(fit(PROJ.name || "", 24) + "   " + fit(FILE, 40), 300, 42, COL.dim, 22);
  text(bpmText, 1000, 44, tp.src === "project" ? COL.dim : COL.amber, 34, true);
  text(pos ? "BAR " + bar + "  BEAT " + beat : "no clock: the project's tempo", 1240, 42, pos ? COL.text : COL.dim, 22);
  text(run ? "PLAY" : "STOP", 1560, 42, run ? COL.good : COL.dim, 26, true);
  text(mmss(A) + " / " + mmss(dur), W - 28, 42, COL.text, 24, false, "right");
}
function drawPads(T) {
  const [x0, y0, w, h] = L.pads;
  panel(x0, y0, w, h);
  const bank = bankInView(T), b = bank.charCodeAt(0) - 65;
  const gap = 12, tw = (w - 40 - 3 * gap) / 4, th = (h - 18 - 56 - 3 * gap) / 4, gx = x0 + 20, gy = y0 + 18;
  const cur = patternAt(T), inPat = cur ? cur.p.pads : null; // the pads of the pattern that plays are outlined
  for (let i = 0; i < 16; i++) {
    const n = b * 16 + i, row = Math.floor(i / 4), col = i % 4;
    const x = gx + col * (tw + gap), y = gy + row * (th + gap);
    const info = padInfo.get(n), st = padState(bank, i + 1, T);
    rrect(x, y, tw, th, 10, info ? COL.tile : COL.tile2);
    let glow = 0;
    if (st) { const age = T - st.hitAt; glow = st.held ? 1 : clamp(1 - age / 0.45, 0, 1); glow *= 0.35 + 0.65 * (st.v || 100) / 127; }
    if (glow > 0) { g.globalAlpha = glow * 0.85; rrect(x, y, tw, th, 10, COL.amber); g.globalAlpha = 1; }
    if (st && st.held) { g.strokeStyle = "#fff"; g.lineWidth = 3; g.beginPath(); g.roundRect(x + 1.5, y + 1.5, tw - 3, th - 3, 9); g.stroke(); }
    if (st && st.hitAt >= 0) { // how hard the last hit was, fading: a bar at the right edge and a ring
      const age = T - st.hitAt;
      if (age >= 0 && age < 1.4) { g.globalAlpha = 1 - age / 1.4; rect(x + tw - 14, y + th - 10 - (th - 20) * (st.v || 100) / 127, 6, (th - 20) * (st.v || 100) / 127, COL.amber); g.strokeStyle = COL.amber; g.lineWidth = 3; g.beginPath(); g.roundRect(x + 1.5, y + 1.5, tw - 3, th - 3, 9); g.stroke(); g.globalAlpha = 1; }
    }
    const hl = hitTimes.get(bank + (i + 1)), hc = hl ? atIndex(hl, T) + 1 : 0;
    if (hc > 0) text("x" + hc, x + tw - 14, y + 28, glow > 0.5 ? "#111" : COL.dim, 18, false, "right");
    if (inPat && inPat.has(n)) { g.strokeStyle = COL.amberD; g.lineWidth = 2; g.beginPath(); g.roundRect(x + 1, y + 1, tw - 2, th - 2, 9); g.stroke(); }
    if (info && info.bus) rect(x + 2, y + 10, 6, th - 20, BUSCOL[info.bus]);
    const dark = glow > 0.5;
    text(String.fromCharCode(65 + b) + (i + 1), x + 20, y + 28, dark ? "#111" : COL.amber, 24, true);
    if (info) {
      text(fit(info.name, Math.floor((tw - 30) / (VERT ? 14.2 : 11.5))), x + 20, y + 54, dark ? "#111" : COL.text, 19);
      const pk = info.peaks || [];
      for (let k = 0; k < pk.length; k++) {
        const bh = Math.max(2, pk[k] / 100 * (th - 78));
        rect(x + 20 + k * (tw - 40) / pk.length, y + th - 10 - bh, Math.max((tw - 40) / pk.length * 0.7, 2), bh, dark ? "#5a4000" : mix("#444444", "#ffb000", 0.35));
      }
    } else text("empty", x + 20, y + 54, COL.dim, 19);
  }
  for (let k = 0; k < 10; k++) {
    const sp = (w - 40) / 10, x = gx + k * sp, y = y0 + h - 48;
    const letter = String.fromCharCode(65 + k);
    let act = 0; for (let i = 1; i <= 16; i++) { const st = padState(letter, i, T); if (st && (st.held || T - st.hitAt < 0.4)) act = 1; }
    rect(x, y, sp - 8, 32, k === b ? COL.amber : mix("#2b2b2b", "#7a5a00", act));
    text(letter, x + (sp - 8) / 2, y + 23, k === b ? "#111" : COL.dim, 20, true, "center");
  }
}

// has a pad been heard in the last pass of the pattern, while others were? (the unit does not say that a track is muted: this is a guess)
function mutedGuess(pad, p, T) {
  const pos = playPosition(T); if (!pos) return false;
  const lenS = (p.length / 480) * 60 / pos.bpm;
  if (T - lenS < 0) return false;
  let others = 0, mine = 0;
  for (const [k, l] of padEv) {
    const n = (k.charCodeAt(0) - 65) * 16 + parseInt(k.slice(1), 10) - 1;
    if (!p.pads.has(n)) continue;
    const i = atIndex(l, T);
    for (let j = i; j >= 0 && l[j].t >= T - lenS; j--) if (l[j].on) { if (n === pad) mine++; else others++; }
  }
  return mine === 0 && others > 3;
}

function drawPattern(T) {
  const [x0, y0, w, h] = L.pattern;
  panel(x0, y0, w, h);
  const r = patternAt(T);
  if (!r) { text("PATTERN", x0 + 16, y0 + 30, COL.dim, 20, true); text("not known: the unit did not say.", x0 + 16, y0 + 80, COL.dim, 22); text("Pick it in the bar below where it starts.", x0 + 16, y0 + 112, COL.dim, 22); return; }
  const p = r.p, steps = Math.max(Math.round(p.length / 120), 16);
  text("PATTERN " + p.label + "   " + p.bars + " bars" + (r.how === "guess" ? "   (guessed from the pads)" : r.how === "chosen" ? "   (chosen)" : r.how === "cue" ? "   (set by hand)" : ""), x0 + 16, y0 + 30, COL.amber, 20, true);
  const pads = [...p.pads].sort((a, b) => a - b).slice(0, 10);
  drawPatternStrip(x0 + 16, y0 + 44, w - 32, T);
  const rows = Math.max(pads.length, 1), rh = Math.min(32, (h - 118) / rows);
  const ix = x0 + 12, iw = 330;           // the pads of the pattern: their settings
  const gx = x0 + iw + 20, gw = w - iw - 40;
  const pos = playPosition(T), lenQ = p.length / 480;
  const phase = pos ? (pos.q % lenQ) : -1;
  const visible = Math.min(steps, 32), first = phase < 0 ? 0 : clamp(Math.floor(phase * 4 / visible) * visible, 0, steps - visible);
  const cw = gw / visible;
  pads.forEach((n, ri) => {
    const y = y0 + 96 + ri * rh;
    const info = padInfo.get(n), mi = info && info.info ? info.info : {};
    const muted = mutedGuess(n, p, T);
    g.globalAlpha = muted ? 0.4 : 1;
    rect(ix, y + 2, 6, rh - 5, info && info.bus ? BUSCOL[info.bus] : "#444");
    text(String.fromCharCode(65 + Math.floor(n / 16)) + (n % 16 + 1), ix + 14, y + rh * 0.68, COL.text, 17, true);
    const flags = [mi.Gate === "on" ? "G" : "", mi.Loop === "on" ? "L" : "", mi["One shot"] === "on" ? "O" : "", mi.Mode && mi.Mode !== "forward" ? "R" : ""].join("");
    text((mi.Bus && mi.Bus !== "off" ? mi.Bus.replace("BUS ", "B") : "-") + " L" + (mi.Level || "?") + " " + (mi.Pan || "") + " " + flags, ix + 76, y + rh * 0.68, COL.text, 16);
    if (muted) text("muted?", ix + 250, y + rh * 0.68, COL.bad, 15, true);
    for (let s = 0; s < visible; s++) rect(gx + s * cw + 1, y + 1, cw - 2, rh - 3, (first + s) % 4 === 0 ? "#303030" : "#262626");
    for (const nt of p.notes) {
      if (nt[1] !== n) continue;
      const s = nt[0] / 120 - first; if (s < -0.01 || s >= visible) continue;
      const hgt = Math.max(5, (rh - 5) * nt[2] / 127);
      let c = COL.amber;
      if (phase >= 0) { const d = (phase * 4 - (nt[0] / 120)); if (d >= 0 && d < 1.5) c = mix("#ffb000", "#ffffff", 1 - d / 1.5); }
      rect(gx + s * cw + 1, y + rh - 3 - hgt, Math.max(cw * 0.9, 5), hgt, c);
    }
    g.globalAlpha = 1;
  });
  if (phase >= 0) { const s = phase * 4 - first; if (s >= 0 && s <= visible) rect(gx + s * cw - 1, y0 + 90, 3, rows * rh + 8, COL.good); }
  if (steps > visible) text("steps " + (first + 1) + "-" + (first + visible) + " of " + steps, x0 + w - 16, y0 + 30, COL.dim, 18, false, "right");
  if (pads.length < p.pads.size) text("+" + (p.pads.size - pads.length) + " more pads", ix, y0 + h - 10, COL.dim, 16);
}

// the patterns in turn: the ones before, the one that plays, the ones to come (the cues are known) and when the next one starts
function drawPatternStrip(x, y, w, T) {
  const list = []; for (const e of patEv) if (e.now && (!list.length || list[list.length - 1].now !== e.now)) list.push(e);
  let cur = -1; for (let i = 0; i < list.length; i++) if (list[i].t <= T) cur = i;
  if (!list.length) return;
  const from = Math.max(cur - 2, 0), shown = list.slice(from, from + 7);
  let cx = x;
  shown.forEach((e, k) => {
    const on = from + k === cur, w2 = 70;
    rrect(cx, y, w2, 34, 8, on ? COL.amber : COL.tile);
    text(e.now, cx + w2 / 2, y + 24, on ? "#111" : (from + k < cur ? COL.dim : COL.text), 20, true, "center");
    cx += w2 + 10;
    if (k < shown.length - 1) text(">", cx - 8, y + 24, COL.dim, 18, false, "center");
  });
  const nx = list[cur + 1];
  if (nx) {
    const bpm = tempoAt(T).bpm || 120, beats = (nx.t - T) * bpm / 60;
    const when = beats >= 8 ? "in " + (beats / 4).toFixed(1) + " bars" : beats > 1 ? "in " + Math.ceil(beats) + " beats" : "now";
    text("NEXT " + nx.now + " " + when, x + w, y + 24, COL.amber, 22, true, "right");
  }
}

function knob(cx, cy, r, v, label, c, hist, T) {
  const k = r / 40, a0 = Math.PI * 0.75, a1 = Math.PI * 2.25;
  g.lineWidth = 9 * k; g.lineCap = "round";
  g.strokeStyle = "#2b2b2b"; g.beginPath(); g.arc(cx, cy, r, a0, a1); g.stroke();
  if (v !== null) {
    g.strokeStyle = c; g.beginPath(); g.arc(cx, cy, r, a0, a0 + (a1 - a0) * v / 127); g.stroke();
    const a = a0 + (a1 - a0) * v / 127;
    g.strokeStyle = "#fff"; g.lineWidth = 4 * k; g.beginPath(); g.moveTo(cx + Math.cos(a) * (r - 22 * k), cy + Math.sin(a) * (r - 22 * k)); g.lineTo(cx + Math.cos(a) * (r + 3 * k), cy + Math.sin(a) * (r + 3 * k)); g.stroke();
  }
  g.lineCap = "butt";
  text(v === null ? "-" : String(v), cx, cy + 9 * k, v === null ? COL.dim : COL.text, 24 * k, true, "center");
  text(fit(label, k < 0.8 ? 9 : 12), cx, cy + r + 28 * k, COL.dim, Math.max(13, 16 * k), false, "center");
  const sw = 104 * k, sh = 26 * k, sx = cx - sw / 2, sy = cy + r + 36 * k;
  rect(sx, sy, sw, sh, "#222");
  if (hist.length) {
    g.strokeStyle = c; g.lineWidth = 2; g.beginPath();
    const span = 6;
    let pv = hist[0].v;
    const pt = (t, val) => [sx + clamp((t - (T - span)) / span, 0, 1) * sw, sy + sh - 2 - (sh - 4) * val / 127];
    const [x1, y1] = pt(Math.max(hist[0].t, T - span), pv); g.moveTo(x1, y1);
    for (const e of hist) { const [x, y] = pt(e.t, pv); g.lineTo(x, y); const [x2, y2] = pt(e.t, e.v); g.lineTo(x2, y2); pv = e.v; }
    const [xe, ye] = pt(T, pv); g.lineTo(xe, ye); g.stroke();
  }
}

// the four buses side by side, in one row
function drawFx(T) {
  const [x0, y0, w, h] = L.fx;
  panel(x0, y0, w, h);
  const bw = w / 4;
  for (let bus = 1; bus <= 4; bus++) {
    const x = x0 + (bus - 1) * bw, c = BUSCOL[bus];
    rect(x + 12, y0 + 14, 5, 50, c);
    text("BUS " + bus, x + 26, y0 + 38, c, 22, true);
    const name = fxName(bus, T), on = at(fxOn.get(bus) || [], T);
    text(name ? fit(name, 19) : "effect unknown", x + 26, y0 + 62, name ? COL.text : COL.dim, 17);
    if (on) { rect(x + bw - 62, y0 + 16, 50, 26, on.v ? COL.good : "#2b2b2b"); text(on.v ? "ON" : "OFF", x + bw - 37, y0 + 36, on.v ? "#111" : COL.dim, 17, true, "center"); }
    const defs = ((window.SP404_FX || {}).params || {})[name] || [];
    for (let i = 0; i < 3; i++) {
      const cx = x + bw * (0.17 + 0.33 * i), cy = y0 + 124;
      const v = ccValue(bus, 16 + i, T);
      const label = defs[i] && defs[i].n ? defs[i].n : "CTRL " + (i + 1);
      knob(cx, cy, 27, v, label, c, ccHistory(bus, 16 + i, T, 6), T);
    }
    if (bus > 1) rect(x, y0 + 14, 1, h - 28, "#2b2b2b");
  }
}

function levelDb(v) { return v <= 0 ? -Infinity : 20 * Math.log10(v); }
function drawMeter(T) {
  const [x0, y0, w, h] = L.meter;
  panel(x0, y0, w, h, "LEVEL");
  if (!peak) { text("no analysis of the audio", x0 + 16, y0 + 80, COL.dim, 22); return; }
  const f = clamp(Math.floor(T_audio * AN.fps), 0, AN.frames - 1);
  const bw = w - 190, bx = x0 + 60;
  let clip = false;
  for (let c = 0; c < 2; c++) {
    let lvl = -Infinity;
    for (let k = 0; k < 8; k++) { const ff = f - k; if (ff < 0) break; const v = peak[ff * 2 + c] / 65535; lvl = Math.max(lvl, levelDb(v) - k * 1.5); }
    const fr = lvl === -Infinity ? 0 : clamp((lvl + 60) / 60, 0, 1);
    const y = y0 + 46 + c * 40;
    text(c ? "R" : "L", x0 + 24, y + 24, COL.dim, 22, true);
    rect(bx, y, bw, 30, "#2b2b2b");
    rect(bx, y, bw * clamp(fr, 0, 0.8), 30, COL.good);
    if (fr > 0.8) rect(bx + bw * 0.8, y, bw * (clamp(fr, 0, 0.95) - 0.8), 30, "#e8d44a");
    if (fr > 0.95) rect(bx + bw * 0.95, y, bw * (fr - 0.95), 30, COL.bad);
    text(lvl === -Infinity ? "-inf" : lvl.toFixed(1), x0 + w - 20, y + 24, COL.dim, 20, false, "right");
    for (let k = 0; k < 6; k++) if (peak[Math.max(f - k, 0) * 2 + c] > 65535 * 0.966) clip = true;
  }
  if (clip) { rect(x0 + w - 110, y0 + 10, 90, 28, COL.bad); text("CLIP", x0 + w - 65, y0 + 32, "#111", 20, true, "center"); }
  const sx = x0 + 24, sy = y0 + 134, sw = w - 48, sh = Math.max(h - 134 - 34 - (VERT ? 12 : 66), 40), nb = AN.bands;
  rect(sx, sy, sw, sh, "#161616");
  const bwid = sw / nb;
  for (let i = 0; i < nb; i++) {
    let v = 0;
    for (let k = 0; k < 5; k++) { const ff = f - k; if (ff < 0) break; v = Math.max(v, spec[ff * nb + i] / 255 - k * 0.04); }
    const bh = clamp(v, 0, 1) * (sh - 8);
    rect(sx + i * bwid + 1, sy + sh - 4 - bh, bwid - 2, Math.max(bh, 2), mix("#ffb000", "#ff5f5f", clamp(v - 0.6, 0, 0.4) / 0.4));
  }
  text("30 Hz", sx + 4, sy + sh + 18, COL.dim, 14); text("18 kHz", sx + sw, sy + sh + 18, COL.dim, 14, false, "right");
  if (!VERT) drawTempo(x0 + 24, y0 + h - 68, w - 48, 54, T);
}

// the tempo over the whole take: the tempo of the bank of each pattern in turn (the clock where no pattern is known)
function tempoSteps() {
  const d = AN.duration, pts = [], list = [];
  for (const e of patEv) if (e.now && patByLabel.has(e.now)) list.push({ t: e.t - OFFSET, bpm: bankTempo(patternBank(patByLabel.get(e.now))) });
  if (list.length && list.every(e => e.bpm)) {
    pts.push({ t: 0, bpm: list[0].bpm });
    for (const e of list) { pts.push({ t: e.t, bpm: pts[pts.length - 1].bpm }); pts.push({ t: e.t, bpm: e.bpm }); }
    pts.push({ t: d, bpm: pts[pts.length - 1].bpm });
    return pts;
  }
  return tempoSeries.map(e => ({ t: e.t - OFFSET, bpm: e.bpm }));
}
function drawTempo(sx, sy, sw, sh, T) {
  text("TEMPO", sx, sy + 14, COL.dim, 16, true);
  const d = AN.duration, pts = tempoSteps();
  if (!pts.length || !d) { text("no clock in the take", sx + 90, sy + 14, COL.dim, 16); return; }
  let lo = Infinity, hi = -Infinity; for (const e of pts) { lo = Math.min(lo, e.bpm); hi = Math.max(hi, e.bpm); }
  const mid = (lo + hi) / 2, half = Math.max((hi - lo) / 2, 2) * 1.2;
  const gx = sx + 90, gw = sw - 190, gy = sy + 2, gh = sh - 4;
  rect(gx, gy, gw, gh, "#161616");
  g.strokeStyle = COL.amber; g.lineWidth = 2; g.beginPath();
  pts.forEach((e, i) => { const x = gx + clamp(e.t / d, 0, 1) * gw, y = gy + gh / 2 - (e.bpm - mid) / half * gh / 2; i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.stroke();
  rect(gx + clamp(T_audio / d, 0, 1) * gw - 1, gy, 3, gh, COL.good);
  const bpm = tempoAt(T).bpm;
  text(bpm ? (Number.isInteger(bpm) ? bpm : bpm.toFixed(1)) : "", sx + sw, sy + 40, COL.amber, 28, true, "right");
  text(lo === hi ? "steady" : lo + " - " + hi, sx + sw, sy + 12, COL.dim, 14, false, "right");
}

let T_audio = 0;
function draw(audioTime) {
  T_audio = audioTime;
  const T = audioTime + OFFSET + NUDGE / 1000;
  rect(0, 0, W, H, COL.bg);
  drawHeader(T, audioTime);
  drawPads(T);
  drawPattern(T);
  drawFx(T);
  drawMeter(T);
  drawFeed(T);
}

// ---- the page: the audio drives the time
const audio = document.getElementById("audio"), play = document.getElementById("play"), seek = document.getElementById("seek");
const timeEl = document.getElementById("time"), nudgeEl = document.getElementById("nudge"), speed = document.getElementById("speed");
let manual = null; // a program that sets the time itself (a render)
function now() { return manual !== null ? manual : audio.currentTime; }
function frame() {
  const t = now();
  draw(t);
  const d = AN ? AN.duration : audio.duration || 0;
  if (document.activeElement !== seek && d) seek.value = String(Math.round(t / d * 1000));
  timeEl.textContent = mmss(t) + " / " + mmss(d);
  play.textContent = audio.paused ? "play" : "pause";
  requestAnimationFrame(frame);
}
play.onclick = () => (audio.paused ? audio.play() : audio.pause());
seek.oninput = () => { const d = AN ? AN.duration : audio.duration; audio.currentTime = seek.value / 1000 * d; };
speed.onchange = () => { audio.playbackRate = parseFloat(speed.value); };
document.getElementById("full").onclick = () => document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT" && e.target.id === "title") return;
  if (e.code === "Space") { e.preventDefault(); play.onclick(); }
  else if (e.key === "ArrowLeft") audio.currentTime = Math.max(audio.currentTime - (e.shiftKey ? 30 : 5), 0);
  else if (e.key === "ArrowRight") audio.currentTime += e.shiftKey ? 30 : 5;
  else if (e.key === "[") { NUDGE -= 10; nudgeEl.textContent = "sync " + (NUDGE >= 0 ? "+" : "") + NUDGE + " ms"; }
  else if (e.key === "]") { NUDGE += 10; nudgeEl.textContent = "sync " + (NUDGE >= 0 ? "+" : "") + NUDGE + " ms"; }
  else if (e.key === "f") document.getElementById("full").onclick();
});

async function start() {
  const msg = document.getElementById("msg");
  try {
    const [ev, an] = await Promise.all([fetch("/events.json").then(r => r.json()), fetch("/analysis.json").then(r => r.json())]);
    FILE = ev.file; TITLE = params.get("title") || ev.title || ""; prepare(ev.events, an, ev.cues);
  } catch (e) { msg.textContent = "could not load the replay: " + e; msg.style.display = "block"; return; }
  const t0 = parseFloat(params.get("t") || "0");
  if (t0) audio.currentTime = t0;
  // for a render: window.replay.setTime(t) draws the frame of that time and nothing moves by itself
  window.replay = { duration: AN.duration, fps: AN.fps, offset: OFFSET, setTime(t) { manual = t; draw(t); return true; }, release() { manual = null; }, draw };
  window.replayReady = true;
  if (params.get("t") !== null && params.get("play") === null) manual = t0;
  frame();
}
start();
</script>
