<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>404tui tools</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161618">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="tools.css">
</head>
<body>
<header id="bar" class="bar">
  <a id="back" href="./" title="Back to Perform">◂ PERFORM</a>
  <div class="brand">404<span>tui</span> <small>TOOLS</small></div>
  <div id="unit" class="unit"><i></i><b id="unitText">no unit</b></div>
</header>

<nav id="modes" aria-label="Tools">
  <button id="mPattern" class="btn on">PATTERN</button>
  <button id="mSlicer" class="btn">SLICER</button>
  <button id="mPad" class="btn">PAD</button>
</nav>
<div id="other" class="other" hidden><span id="otherText"></span> <button id="otherClose" class="btn">CLOSE IT</button></div>

<main>
  <section id="left" class="panel">
   <div id="patview">
    <div id="patbar">
      <div class="pb-top">
        <button id="bankOpen" class="btn bankchip2" hidden>BANK <b id="bankOpenL">A</b> ▾</button>
        <label>BANK <select id="bank"></select></label>
        <label>PATTERN <select id="pat"></select></label>
        <button id="open" class="btn go" title="The tools of the pattern: they write into it as a trial; Keep it commits">PATTERN TOOLS</button>
      </div>
      <div class="pb-seg">
        <button id="play" class="btn">▶ PLAY HERE</button>
        <button id="undo" class="btn" title="Undo (a kept tool is one step)">UNDO</button>
        <button id="redo" class="btn">REDO</button>
      </div>
      <div class="pb-seg pb-midi">
        <button id="midiIn" class="btn" title="Make a pattern of a track of a MIDI file (.mid)">MIDI FILE IN…</button>
        <button id="midiOut" class="btn" title="Save this pattern as a MIDI file">MIDI FILE OUT</button>
        <input id="midiFile" type="file" accept=".mid,.midi,audio/midi,audio/x-midi" hidden>
      </div>
    </div>
    <div id="patinfo" class="dim"></div>
    <div id="grid" role="grid" aria-label="The pattern"></div>
   </div>
   <div id="sliceview" hidden>
    <div class="row">
      <b id="slTitle" class="slt"></b>
      <button id="slUndo" class="btn">UNDO</button>
      <button id="slRedo" class="btn">REDO</button>
      <button id="slClose" class="btn">CLOSE</button>
    </div>
    <canvas id="wave" height="170" aria-label="The sample: touch and slide to put the cursor"></canvas>
    <div class="zoombar">
      <span id="slInfo" class="dim"></span>
      <span class="zoomsw" role="group" aria-label="Zoom"><button id="zOut" class="btn" aria-label="Zoom out">−</button><button id="zAll" class="btn">ALL</button><button id="zIn" class="btn" aria-label="Zoom in">+</button></span>
    </div>
    <div class="grp"><span class="gl">PLAY</span>
      <div class="g3"><button id="slOrder" class="btn go" title="Plays the whole order in a loop">▶ ORDER</button><button id="slPlay" class="btn">▶ SLICE</button><button id="slShuffle" class="btn">SHUFFLE</button></div></div>
    <div class="grp"><span class="gl">CUT</span>
      <div class="g2"><button id="slCut" class="btn strong">CUT AT CURSOR</button><button id="slJoin" class="btn">JOIN</button></div></div>
    <div class="grp"><span class="gl">MORE</span>
      <div class="g2"><button id="slSet" class="btn">SETTINGS</button><button id="slTools" class="btn">TOOLS</button></div></div>
   </div>
    <div id="status" class="status"></div>
    <div id="unitbar" class="unitbar">
      <b id="ubTitle">no unit</b>
      <div class="ub-btns">
        <button id="ubMode" class="btn" title="Live: every change you keep goes to the unit. Copy: changes stay in the editor.">COPY</button>
        <button id="ubReload" class="btn" title="The unit reads the project again, so that patterns written to it show (stops the sound)" hidden>RELOAD UNIT</button>
        <button id="ubSend" class="btn" title="Writes the editor's project over the unit's project">SEND TO UNIT</button>
      </div>
    </div>
    <p id="ubWarn" class="warn" hidden></p>
    <div id="ptnStrip" class="strip" aria-label="Patterns of this bank"></div>
  </section>

  <section id="right" class="panel">
    <div id="idle">
      <div id="chooser" hidden>
        <div class="row"><button id="cbankOpen" class="btn bankchip2">BANK <b id="cbankL">A</b> ▾</button><span id="chooseWhy" class="dim"></span></div>
        <div id="cells"></div>
      </div>
    </div>
  </section>
</main>
<div id="sheetBack" hidden></div>
    <div id="menu" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="mtitle">
  <div class="grab" aria-hidden="true"></div>
  <div class="mhead"><button id="mback" class="btn">◂ BACK</button><h2 id="mtitle"></h2><button id="mdone" class="btn go">DONE</button></div>
  <div id="tabs" role="tablist"></div>
  <div id="items"></div>
</div>

<div id="modal" hidden>
  <div class="dialog">
    <h2 id="dTitle"></h2>
    <div id="dBody"></div>
    <div class="row"><button id="dCancel" class="btn">CANCEL</button><button id="dOk" class="btn go" hidden>OK</button></div>
  </div>
</div>
<script src="tools.js"></script>
</body>
</html>
