name: pages

# The page without a server (Motion, Punch, Morph, LFOs, patterns over Web MIDI) at https://moahbeatlab.github.io/404tui/
on:
  push:
    branches: [main]
    paths: ['web/static/**', 'cmd/demowasm/**', 'toolsapi/**', 'core/**', 'app/**', 'formats/**', 'sim/**', 'web/landing/**', 'docs/img/**', 'version/version.go', 'Makefile', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
